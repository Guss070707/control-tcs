<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121624">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control TCs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='38' rx='7' fill='%234f8ef7'/%3E%3Crect x='4' y='22' width='56' height='7' fill='%23121624'/%3E%3Crect x='12' y='38' width='16' height='5' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#121624; --panel:#1a2032; --panel2:#212841; --line:#2b3450; --line2:#38425f;
  --text:#e7eaf3; --muted:#8e97ad; --dim:#69728a;
  --accent:#4f8ef7; --accent-2:#3a76de; --ok:#3fbf8a; --warn:#f5a524; --bad:#ef5b5f;
  --r:12px; --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.between{justify-content:space-between} .right{text-align:right}

/* Encabezado y navegación */
header.top{position:sticky;top:0;z-index:20;background:#121624;border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.sync{font-size:12px;padding:3px 10px;border-radius:99px;background:#16352c;color:var(--ok);white-space:nowrap}
.sync.busy{background:#3a3016;color:var(--warn)} .sync.err{background:#3d1b1f;color:var(--bad)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
nav.tabs button.on{color:var(--text);background:var(--panel2)}
nav.tabs svg{width:20px;height:20px}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#161b2b;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:4px 6px;flex:1}
  nav.tabs button.on{background:none;color:var(--accent)}
  .top-inner .spacer{flex:1}
}
@media (min-width:761px){ body{padding-bottom:32px} .top-inner .spacer{flex:1} }

main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:4px 0 14px} h3{font-size:16px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi .lbl{font-size:12px;color:var(--muted)} .kpi .val{font-size:22px;font-weight:700;margin-top:2px}
.cols2{grid-template-columns:1fr 1fr} @media (max-width:900px){.cols2{grid-template-columns:1fr}}

/* Controles */
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4a5679}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;line-height:0}
.icon-btn:hover{color:var(--text);background:var(--panel2)}
.icon-btn svg{width:18px;height:18px}
input.f,select.f,textarea.f{width:100%;background:#11162a;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
textarea.f{min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.l{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#11162a;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 22%,#11162a);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag .dot{width:7px;height:7px;border-radius:50%}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.badge.ok{background:#16352c;color:var(--ok)} .badge.warn{background:#3a3016;color:var(--warn)} .badge.bad{background:#3d1b1f;color:var(--bad)}

/* Tarjetas de crédito */
.tc{border-left:4px solid var(--c)}
.tc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.tc-name{font-weight:700;font-size:16px}
.amount{font-size:20px;font-weight:700}
.bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:#11162a;margin:8px 0}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend b{color:var(--text);font-weight:600}
.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* Registro */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 110px 160px 150px 34px;gap:8px;align-items:center;background:#161c2e;border:1px solid var(--line);border-radius:10px;padding:8px}
@media (max-width:760px){
  .item{grid-template-columns:1fr 104px 34px;grid-template-areas:"d m x" "p p p" "c c c"}
  .item .i-d{grid-area:d} .item .i-m{grid-area:m} .item .i-x{grid-area:x} .item .i-p{grid-area:p} .item .i-c{grid-area:c}
}
.item input.f,.item select.f{padding:8px 9px}
.item .i-m input{text-align:right}
.savebar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:10;background:rgba(26,32,50,.97);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
@media (min-width:761px){.savebar{bottom:12px}}
.paste-box{background:#141a2b;border:1px dashed var(--line2);border-radius:10px;padding:12px;margin-bottom:12px}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{font-size:12px;color:var(--muted);margin:14px 0 2px;text-transform:capitalize}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
.scroll-x{overflow-x:auto}
table.t.centro th,table.t.centro td{text-align:center}
table.t.centro td input.num{text-align:center}
table.t.centro td input[type=checkbox]{width:18px;height:18px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.money{position:relative;display:inline-block}
.money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money input.f{padding-left:32px!important;text-align:left!important}
.money.der{display:block} .money.der input.f{text-align:right!important}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;background:#11162a;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav .m{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* Modal y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,16,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:761px){.modal-bg{align-items:center}}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px}
@media (min-width:761px){.modal{border-radius:16px}}
.modal h3{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);z-index:60;background:#0f1424;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{border-color:var(--bad);color:#ffd7d8}
@media (min-width:761px){.toast{bottom:24px}}

/* Login */
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:22px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0 18px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}
.pin-dots span.on{background:var(--accent);border-color:var(--accent)}
.pin-hidden{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px 0;font-size:22px;cursor:pointer}
.keypad button:active{background:var(--accent)}
.keypad button.k-sec{font-size:15px;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login" class="login hidden">
  <div class="brand" style="justify-content:center;margin-bottom:18px;font-size:22px">
    <svg viewBox="0 0 64 64"><rect x="4" y="14" width="56" height="38" rx="7" fill="#4f8ef7"/><rect x="4" y="22" width="56" height="7" fill="#121624"/><rect x="12" y="38" width="16" height="5" rx="2" fill="#fff"/></svg>
    Control TCs
  </div>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="field" id="lgUsuariosBox"><label class="l">¿Quién eres?</label><div class="chips" id="lgUsuarios"></div></div>
    <label class="l" style="text-align:center">PIN</label>
    <div class="pin-dots" id="pinDots"></div>
    <input id="lgPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" class="pin-hidden">
    <div class="keypad" id="keypad"></div>
    <p class="small bad" id="lgErr" style="text-align:center;min-height:20px"></p>
  </form>
</div>

<!-- ======================= APP ======================= -->
<div id="app" class="hidden">
  <header class="top"><div class="top-inner">
    <div class="brand"><svg viewBox="0 0 64 64"><rect x="4" y="14" width="56" height="38" rx="7" fill="#4f8ef7"/><rect x="4" y="22" width="56" height="7" fill="#121624"/><rect x="12" y="38" width="16" height="5" rx="2" fill="#fff"/></svg>Control TCs</div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <span class="sync" id="sync">Sincronizado</span>
    <button class="icon-btn" title="Bloquear" onclick="bloquear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    <button class="icon-btn" title="Actualizar" onclick="recargar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  </div></header>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
// ==LOGIC-START==
// Funciones puras (sin acceso a la base de datos). Se prueban por separado.

const pad = n => String(n).padStart(2, '0');

// Fecha YYYY-MM-DD; si el día no existe en el mes (ej. 31 de noviembre) usa el último día.
function ymd(y, m, d) {
  const base = new Date(Date.UTC(y, m - 1, 1));
  const yy = base.getUTCFullYear(), mm = base.getUTCMonth() + 1;
  const dim = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  return `${yy}-${pad(mm)}-${pad(Math.min(d, dim))}`;
}
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; }
function addDays(s, n) { const { y, m, d } = parseD(s); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function diffDays(a, b) { const A = parseD(a), B = parseD(b); return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 864e5); }
function hoyStr(now = new Date()) { return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`; }

// Ciclo de facturación de una compra.
// - Compra hasta el día de corte (inclusive) → entra en el corte de ese mes; si es después → corte del mes siguiente.
// - Pago: si el día de pago es mayor que el de corte, cae el mismo mes del corte; si no, el mes siguiente.
// - Sin día de corte configurado: el ciclo es el mes calendario. Sin día de pago: corte + 20 días.
function calcCiclo(fecha, t) {
  const { y, m } = parseD(fecha);
  let corte;
  if (!t || !t.dia_corte) corte = ymd(y, m, 31);
  else {
    const c = ymd(y, m, t.dia_corte);
    corte = fecha <= c ? c : ymd(y, m + 1, t.dia_corte);
  }
  const pc = parseD(corte);
  let pago;
  if (!t || !t.dia_pago) pago = addDays(corte, 20);
  else pago = t.dia_pago > pc.d ? ymd(pc.y, pc.m, t.dia_pago) : ymd(pc.y, pc.m + 1, t.dia_pago);
  return { fecha_corte: corte, fecha_pago: pago };
}

// Dinero: todo se suma en céntimos enteros para no perder precisión.
const toC = x => Math.round(Number(x) * 100);
const fromC = c => c / 100;
function sumC(arr, f = x => x.monto) { return arr.reduce((a, x) => a + toC(f(x)), 0); }

// Reparte un monto entre n personas sin perder céntimos (el céntimo sobrante va a los primeros).
function repartir(monto, n) {
  const c = toC(monto), s = c < 0 ? -1 : 1, a = Math.abs(c);
  const b = Math.floor(a / n), r = a - b * n;
  return Array.from({ length: n }, (_, i) => s * (b + (i < r ? 1 : 0)) / 100);
}

// Acepta "19.80", "19,80", "S/ 1,234.50", "1.234,50", "-6.98".
function parseMonto(v) {
  if (typeof v === 'number') return Math.round(v * 100) / 100;
  let s = String(v || '').replace(/s\/\.?/ig, '').replace(/\s/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return Math.round(Number(s) * 100) / 100;
}

// 5800 → "5800"; 5800.5 → "5800.50" (decimales solo si los tiene)
function numCorto(n) { const v = Number(n); return Number.isInteger(v) ? String(v) : v.toFixed(2); }

function fmt(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-' : '') + 'S/ ' + Math.abs(v).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function titulo(s) {
  if (s !== s.toUpperCase()) return s;
  return s.split(' ').map(w => /\d/.test(w) || w.length < 2 ? w.toLowerCase() : w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
}

// Lee el texto copiado de una boleta (Google Lens / texto en vivo del iPhone).
// Devuelve los ítems con monto y, si lo encuentra, el TOTAL impreso para comparar.
function parseBoleta(txt) {
  const lines = String(txt || '').replace(/\r/g, '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const SKIP = /\b(sub ?-?total|op\.? ?grav|gravad|exonerad|inafect|i\.?g\.?v|vuelto|efectivo|cambio|r\.?u\.?c|boleta|factura|ticket|cajer|caja\b|fecha|hora|cliente|dni|gracias|redondeo|son:|visa|mastercard|tarj|importe|pagado|recibido|puntos|nro|n[°º]|direcc|telf?\b|www|\.com|saldo|cuotas?)/i;
  const AMT = /(-?\s?(?:s\/\.?\s*)?\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*(-)?\s*[a-z*]?$/i;
  const QTY = /^(\d+(?:[.,]\d+)?)\s*(?:x|\*|un|und|uni)\.?\s*(?:s\/\.?\s*)?\d+(?:[.,]\d{1,2})?$/i;
  const a = parseEnLinea(lines, SKIP, AMT, QTY);
  if (a.items.length >= 2) return { ...a, columnas: false };
  const b = parseEnColumnas(lines, SKIP);
  return b.items.length > a.items.length ? { ...b, columnas: true } : { ...a, columnas: false };
}
// Formato 1: cada línea trae su producto y su precio ("YOGURT GLORIA 1L   19.80")
function parseEnLinea(lines, SKIP, AMT, QTY) {
  const items = []; let total = null, pend = null;
  for (const l of lines) {
    const m = l.match(AMT);
    if (!m) { if (!SKIP.test(l) && /[a-záéíóúñ]{3,}/i.test(l)) pend = l; continue; }
    let monto = parseMonto(m[1].replace(/\s/g, ''));
    if (isNaN(monto)) continue;
    if (m[2]) monto = -Math.abs(monto);
    let desc = l.slice(0, m.index).replace(/[\s:$=-]+$/, '').trim();
    if (/\btotal\b/i.test(desc) && !/sub/i.test(desc)) { if (total == null) total = Math.abs(monto); pend = null; continue; }
    if (SKIP.test(desc)) { pend = null; continue; }
    desc = desc.replace(/^\d{5,14}\s+/, '').replace(/\s+\d{5,14}$/, '');
    if ((!desc || QTY.test(desc)) && pend) desc = pend + (desc ? ` (${desc.replace(/\s+/g, '')})` : '');
    if (!desc || !/[a-záéíóúñ]{2,}/i.test(desc)) { pend = null; continue; }
    if (/desc|dscto|dcto|ahorro|promo|oferta|cup[oó]n/i.test(desc) && monto > 0) monto = -monto;
    items.push({ descripcion: titulo(desc), monto });
    pend = null;
  }
  return { items, total };
}
// Formato 2: Lens copió por columnas (primero todos los nombres, luego todos los precios).
// Los rótulos del pie (SUBTOTAL, IGV, TOTAL…) marcan cuántos precios del final no son productos;
// las líneas de cabecera sobrantes (razón social, dirección) se descartan desde arriba.
function parseEnColumnas(lines, SKIP) {
  const SOLO = /^-?\s?(?:s\/\.?\s*)?\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\s*-?$/i;
  const nombres = [], montos = [], pie = [];
  let enPie = false;
  for (const l of lines) {
    if (SOLO.test(l)) { montos.push(parseMonto(l.replace(/-$/, '').replace(/\s/g, '')) * (/-$/.test(l) ? -1 : 1)); continue; }
    const esTotal = /\btotal\b/i.test(l) && !/sub/i.test(l);
    const esPie = esTotal || /sub ?-?total|op\.? ?grav|gravad|exonerad|inafect|i\.?g\.?v|efectivo|vuelto|cambio|redondeo|recibido|pagado|visa|mastercard|tarjeta/i.test(l);
    if (esPie && (enPie || esTotal || /sub ?-?total|op\.? ?grav|i\.?g\.?v|gravad/i.test(l))) {
      enPie = true;
      const enLinea = l.match(/(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*$/); // rótulo y monto en la misma línea
      if (enLinea) { if (esTotal) pie.totalDirecto = parseMonto(enLinea[1]); } else pie.push(esTotal);
      continue;
    }
    if (enPie || SKIP.test(l) || !/[a-záéíóúñ]{2,}/i.test(l)) continue;
    nombres.push(l.replace(/^\d{5,14}\s+/, ''));
  }
  const nProd = Math.max(0, montos.length - pie.length);
  const prodMontos = montos.slice(0, nProd), pieMontos = montos.slice(nProd);
  const iTot = pie.indexOf(true);
  const total = pie.totalDirecto != null ? pie.totalDirecto : iTot > -1 && pieMontos[iTot] != null ? Math.abs(pieMontos[iTot]) : null;
  const usados = nombres.slice(Math.max(0, nombres.length - prodMontos.length));
  const off = prodMontos.length - usados.length;
  const items = usados.map((n, i) => {
    let monto = prodMontos[i + off];
    if (/desc|dscto|dcto|ahorro|promo|oferta|cup[oó]n/i.test(n) && monto > 0) monto = -monto;
    return { descripcion: titulo(n), monto };
  }).filter(x => !isNaN(x.monto));
  return { items, total };
}

// Liquidación de una persona por MES CALENDARIO DE COMPRA (YYYY-MM), independiente del ciclo del banco:
// anterior  = gastos comprados antes del mes − pagos recibidos antes del mes
// pendiente = anterior + gastos comprados en el mes − pagos recibidos en el mes
function liquidacion(personaId, mes, gastos, cobros) {
  const ini = mes + '-01';
  const g = gastos.filter(x => x.persona_id === personaId), c = cobros.filter(x => x.persona_id === personaId);
  // Cada pago recibido se aplica primero al mes más antiguo que tenga deuda (aunque se haya pagado después)
  const porMes = {};
  g.forEach(x => { const m = x.fecha.slice(0, 7); porMes[m] = (porMes[m] || 0) + toC(x.monto); });
  let bolsa = sumC(c), anteriorC = 0, aplicadoC = 0;
  for (const m of Object.keys(porMes).sort()) {
    const d = porMes[m], a = d > 0 ? Math.min(Math.max(bolsa, 0), d) : d;
    bolsa -= a;
    if (m < mes) anteriorC += d - a; else if (m === mes) aplicadoC = a;
  }
  const gMes = g.filter(x => x.fecha.slice(0, 7) === mes), cMes = c.filter(x => x.fecha.slice(0, 7) === mes);
  const mesC = porMes[mes] || 0, totalC = sumC(g) - sumC(c);
  return {
    anterior: fromC(anteriorC), mes: fromC(mesC), cobrado: fromC(aplicadoC), pendiente: fromC(anteriorC + mesC - aplicadoC),
    aFavor: fromC(Math.max(-totalC, 0)), saldoTotal: fromC(totalC), gastosMes: gMes, cobrosMes: cMes, ini
  };
}

function sobresInicio() {

function activosConSaldo() {

function lineaCuadre(totalBanco, registradoC) {

function verCiclo(tid, corte) {

function filasDeForm() {

function actualizarTotal() {

// Lo que corresponde a cada persona que no es el titular (en céntimos)
function pagosDeForm(filas) {

// Registra el pago de cada persona; si abonó a la tarjeta, también el pago al banco de ese ciclo
async function registrarPagos(por, metodo, fecha, tid, fechaCorte, nota) {
  for (const [pid, c] of Object.entries(por)) {
    const monto = fromC(c); let pago_banco_id = null;
    if (metodo === 'abono_tarjeta') {
      const pb = numerico(await db(sb.from('pagos_banco').insert({ tarjeta_id: tid, fecha_corte: fechaCorte, fecha, monto, nota: `Abono de ${per(pid).nombre}` }).select().single()));
      S.pagos.push(pb); pago_banco_id = pb.id;
    }
    const cb = await db(sb.from('cobros').insert({ persona_id: +pid, monto, metodo, fecha, depositado: metodo !== 'efectivo', fecha_deposito: metodo !== 'efectivo' ? fecha : null, nota, pago_banco_id }).select().single());

}
async function guardarCompra() {
  if (!F.tarjeta_id) return toast('Elige la tarjeta', true);
  if (!F.fecha) return toast('Pon la fecha', true);
  const filas = filasDeForm();
  if (!filas.length) return toast('Agrega al menos un ítem', true);
  const malo = filas.find(f => !f._ok);
  if (malo) return toast(`Revisa el ítem "${malo.descripcion || 'sin nombre'}": falta producto, monto o persona`, true);
  const t = tar(F.tarjeta_id), ciclo = calcCiclo(F.fecha, t);
  const boleta = crypto.randomUUID ? crypto.randomUUID() : null;
  const rows = filas.map(({ _ok, ...f }) => ({ ...f, fecha: F.fecha, tarjeta_id: F.tarjeta_id, tienda: F.tienda.trim() || null, boleta_id: boleta, ...ciclo }));
  $('#btnGuardar').disabled = true;
  try {
    const data = await db(sb.from('gastos').insert(rows).select(), `Guardado: ${rows.length} ítem(s) en ${t.nombre} por ${fmt(fromC(sumC(rows)))}`);
    S.gastos.push(...data.map(numerico));
    if (F.yaPagado) {
      const por = pagosDeForm(rows);
      if (Object.keys(por).length) {
        await registrarPagos(por, F.yaPagado, F.fecha, F.tarjeta_id, ciclo.fecha_corte, `Pagado al registrar${F.tienda.trim() ? ' · ' + F.tienda.trim() : ''}`);
        toast(`Guardado y registrado como pagado (${METODOS[F.yaPagado]})`);
      }
    }
    const tn = F.tienda.trim();
    if (tn && !S.tiendas.some(x => x.nombre.toLowerCase() === tn.toLowerCase())) {
      const { data: nt } = await sb.from('tiendas').insert({ nombre: tn, tarjeta_id: F.tarjeta_id }).select().single();
      if (nt) S.tiendas.push(nt);
    }
    F = nuevoForm(); vRegistrar();
  } catch (e) { $('#btnGuardar').disabled = false; }
}

async function guardarCobro(pid, id) {
  const monto = parseMonto($('#cbMonto').value);
  if (!(monto > 0)) return toast('Monto inválido', true);
  const metodo = document.querySelector('#cbMetodo .chip.on').dataset.v;
  const fecha = $('#cbFecha').value, nota = $('#cbNota').value.trim() || null, tid = +$('#cbTar').value;
  if (!id) {
    // Si viene de un gasto y abonó a esa misma tarjeta, el abono va al ciclo de ese gasto
    const dg = UI.cobroGasto, corte = dg && dg.tarjeta_id === tid ? dg.fecha_corte : cicloParaAbono(tid, fecha);
    if (metodo === 'abono_tarjeta') await registrarPagos({ [pid]: toC(monto) }, metodo, fecha, tid, corte, nota || (dg && dg.nota) || null);
    else await registrarPagos({ [pid]: toC(monto) }, metodo, fecha, null, null, nota || (dg && dg.nota) || null);
    toast('Pago guardado'); cerrarModal(); render(); return;
  }
  // Edición: mantener sincronizado el pago al banco enlazado
  const c = S.cobros.find(x => x.id === id);
  const row = { monto, metodo, fecha, nota };
  if (metodo !== 'efectivo') row.depositado = true;
  if (c.pago_banco_id && metodo !== 'abono_tarjeta') {
    await db(sb.from('pagos_banco').delete().eq('id', c.pago_banco_id));
    S.pagos = S.pagos.filter(p => p.id !== c.pago_banco_id); row.pago_banco_id = null;
  } else if (c.pago_banco_id) {
    const pb = S.pagos.find(p => p.id === c.pago_banco_id);
    const upd = { monto, fecha, tarjeta_id: tid }; if (!pb || pb.tarjeta_id !== tid) upd.fecha_corte = cicloParaAbono(tid, fecha);
    Object.assign(pb || {}, numerico(await db(sb.from('pagos_banco').update(upd).eq('id', c.pago_banco_id).select().single())));
  } else if (metodo === 'abono_tarjeta') {
    const pb = numerico(await db(sb.from('pagos_banco').insert({ tarjeta_id: tid, fecha_corte: cicloParaAbono(tid, fecha), fecha, monto, nota: `Abono de ${per(pid).nombre}` }).select().single()));
    S.pagos.push(pb); row.pago_banco_id = pb.id;
  }
  Object.assign(c, numerico(await db(sb.from('cobros').update(row).eq('id', id).select().single(), 'Pago guardado')));
  cerrarModal(); render();
}
// Un abono a la tarjeta baja primero el ciclo cerrado más antiguo sin pagar; si no hay, el ciclo en curso
function cicloParaAbono(tid, fecha) {
  const t = tar(tid), pend = ciclosDe(t).filter(c => c.fecha_corte < fecha && c.pagadoC < c.totalC);
  return pend.length ? pend[0].fecha_corte : calcCiclo(fecha, t).fecha_corte;
}
function whatsapp(pid) {
  const p = per(pid), mes = UI.mesCobro, l = liquidacion(pid, mes, S.gastos, S.cobros);
  const porT = {}; l.gastosMes.forEach(g => (porT[g.tarjeta_id] ||= []).push(g));
  let txt = `Hola ${p.nombre}, este es tu resumen de compras con tarjeta de ${nombreMes(mes)}:\n`;
  for (const [tid, gs] of Object.entries(porT)) {
    txt += `\n*${tar(tid).nombre}*: ${fmt(fromC(sumC(gs)))}\n`;
    gs.sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(g => txt += `• ${dm(g.fecha)} ${g.descripcion}: ${fmt(g.monto)}\n`);
  }
  txt += `\nTotal de ${nombreMes(mes).split(' ')[0]}: ${fmt(l.mes)}`;
  if (l.anterior) txt += `\nPendiente de meses anteriores: ${fmt(l.anterior)}`;
  if (l.cobrado) txt += `\nYa pagaste: ${fmt(l.cobrado)}`;
  txt += `\n*Total a pagar: ${fmt(Math.max(l.pendiente, 0))}*`;
  if (l.aFavor) txt += `\n(Tienes ${fmt(l.aFavor)} a favor)`;
  const tel = (p.telefono || '').replace(/\D/g, '');
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`, '_blank');
}

async function borrar(tabla, id) {

  if (enlazado) { await db(sb.from('pagos_banco').delete().eq('id', enlazado)); S.pagos = S.pagos.filter(p => p.id !== enlazado); }
  if (tabla === 'pagos_banco') S.cobros.forEach(c => { if (c.pago_banco_id === id) c.pago_banco_id = null; });
  const k = { gastos: 'gastos', cobros: 'cobros', pagos_banco: 'pagos', tiendas: 'tiendas', recurrentes: 'recurrentes', aportes_sobre: 'aportes' }[tabla];

}

      <div class="list">${S.tiendas.map(t => `<div class="li" data-id="${t.id}"><input class="f grow" name="nombre" value="${esc(t.nombre)}"><select class="f" name="tarjeta_id" style="max-width:160px">${tOps(t.tarjeta_id)}</select>
        <button class="btn sm" onclick="guardarFila('tiendas',${t.id},this)">Guardar</button><button class="icon-btn" onclick="borrar('tiendas',${t.id})" title="Eliminar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>`).join('')}</div>
      <button class="btn sm" style="margin-top:8px" onclick="nuevo('tiendas',{nombre:'Nueva tienda'})">+ Tienda</button></div>

    <div class="card"><h3>Respaldo y sesión</h3>
      <p class="small muted">Sesión: ${esc(S.user.email)}</p>
      <div class="row wrap"><button class="btn" onclick="respaldo()">Descargar respaldo completo (JSON)</button><button class="btn danger" onclick="salir()">Cerrar sesión</button></div></div>`;
}
function leerFila(btn) {
  const cont = btn.closest('[data-id]'), out = {};
  cont.querySelectorAll('[name]').forEach(el => {
    const k = el.name;
    if (el.type === 'checkbox') out[k] = el.checked;
    else if (['dia_corte', 'dia_pago', 'tarjeta_id', 'persona_id', 'orden'].includes(k)) out[k] = el.value ? Number(el.value) : null;
    else if (['monto', 'linea_credito'].includes(k)) out[k] = el.value.trim() ? parseMonto(el.value) : null;
    else out[k] = el.value.trim() || (k === 'telefono' ? null : el.value.trim());
  });
  return out;
}
async function guardarFila(tabla, id, btn) {
  const row = leerFila(btn);
  if ('monto' in row && (row.monto == null || isNaN(row.monto))) return toast('Monto inválido', true);
  if (tabla === 'recurrentes' && !row.tarjeta_id) return toast('Elige la tarjeta del cargo fijo', true);
  if (tabla === 'recurrentes' && row.activo && !row.monto) return toast('Pon el monto antes de activar el cargo fijo', true);
  const data = numerico(await db(sb.from(tabla).update(row).eq('id', id).select().single(), 'Guardado'));
  const k = { personas: 'personas', recurrentes: 'recurrentes', tiendas: 'tiendas' }[tabla];
  Object.assign(S[k].find(x => x.id === id), data);
  if (tabla === 'personas' && data.es_titular) {
    const otros = S.personas.filter(p => p.es_titular && p.id !== id);
    for (const o of otros) { await sb.from('personas').update({ es_titular: false }).eq('id', o.id); o.es_titular = false; }
  }
  render();
}
async function guardarTarjeta(id, btn) {
  const row = leerFila(btn), t = S.tarjetas.find(x => x.id === id);
  if (row.linea_credito != null && isNaN(row.linea_credito)) return toast('Línea de crédito inválida', true);
  const cambiaCiclo = row.dia_corte !== (t.dia_corte || null) || row.dia_pago !== (t.dia_pago || null);
  const data = numerico(await db(sb.from('tarjetas').update(row).eq('id', id).select().single(), 'Tarjeta guardada'));
  Object.assign(t, data);
  if (cambiaCiclo) await recalcularCiclos(t);
  render();
}
// Recalcula corte/pago de todos los gastos de una tarjeta, agrupando para hacer pocas consultas
async function recalcularCiclos(t) {
  const grupos = {};
  for (const g of S.gastos.filter(g => g.tarjeta_id === t.id)) {
    const c = calcCiclo(g.fecha, t);
    if (c.fecha_corte === g.fecha_corte && c.fecha_pago === g.fecha_pago) continue;
    const k = c.fecha_corte + '|' + c.fecha_pago; (grupos[k] ||= { c, ids: [] }).ids.push(g.id);
  }
  const lista = Object.values(grupos); if (!lista.length) return;
  setSync('busy');
  try {
    for (const { c, ids } of lista) {
      for (let i = 0; i < ids.length; i += 200) {
        const { error } = await sb.from('gastos').update(c).in('id', ids.slice(i, i + 200)); if (error) throw error;
      }
      ids.forEach(id => Object.assign(S.gastos.find(g => g.id === id), c));
    }
    setSync('ok'); toast(`Ciclos de ${t.nombre} recalculados`);
  } catch (e) { setSync('err'); toast('Error al recalcular: ' + e.message, true); }
}
async function nuevo(tabla, row) {
  const data = numerico(await db(sb.from(tabla).insert(row).select().single(), 'Agregado'));
  S[{ tarjetas: 'tarjetas', personas: 'personas', tiendas: 'tiendas' }[tabla]].push(data); render();
}
async function nuevoFijo() {
  const t = activos(S.tarjetas)[0], p = titular();
  if (!t || !p) return toast('Primero crea una tarjeta y una persona', true);
  const data = numerico(await db(sb.from('recurrentes').insert({ descripcion: 'Nuevo cargo', monto: 0, tarjeta_id: t.id, persona_id: p.id, categoria: 'Servicios', activo: false }).select().single(), 'Cargo fijo creado (inactivo hasta que lo completes)'));
  S.recurrentes.push(data); render();
}
function respaldo() {
  const { user, cargado, ...datos } = S;
  descargar(`respaldo_control_tcs_${hoyStr()}.json`, JSON.stringify({ fecha: new Date().toISOString(), ...datos }, null, 1), 'application/json');
}

  // Siempre se pide el PIN al abrir la app
  mostrarLogin();
